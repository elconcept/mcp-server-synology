name: Homelab source sync and verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-dockerhub-main
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: atom2ueki/mcp-server-synology
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      changed: ${{ steps.source.outputs.changed }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
          ssh-strict: true
          persist-credentials: true

      - name: Merge upstream and select the source commit
        id: source
        shell: bash
        env:
          HAS_SYNC_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          changed=false
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            if [[ "$HAS_SYNC_KEY" != "true" ]]; then
              echo "::error::UPSTREAM_SYNC_SSH_KEY is required for scheduled upstream synchronization."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
            git fetch --no-tags upstream "refs/heads/${UPSTREAM_BRANCH}"
            if ! git merge --no-ff -m "chore: sync upstream ${UPSTREAM_BRANCH}" FETCH_HEAD; then
              echo "::error::Upstream merge failed. Resolve the listed conflicts; no changes were pushed."
              git diff --name-only --diff-filter=U
              git merge --abort || true
              exit 1
            fi
            after="$(git rev-parse HEAD)"
            if [[ "$before" != "$after" ]]; then
              changed=true
              if ! git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
                echo "::error::Push rejected. Check branch rules, token permissions or concurrent changes. No force push was attempted."
                exit 1
              fi
            fi
          fi
          sha="$(git rev-parse HEAD)"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          printf 'sha=%s\nchanged=%s\nversion=%s\n' "$sha" "$changed" "$version" >> "$GITHUB_OUTPUT"
          {
            printf '### Selected source\n\n'
            printf -- '- Commit: `%s`\n' "$sha"
            printf -- '- Version: `%s`\n' "$version"
            printf -- '- Upstream changes merged: `%s`\n' "$changed"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the selected source and test dependencies
        run: python -m pip install ".[test]"
      - name: Run unit tests without connecting to a NAS
        run: python -m pytest -m "not real_nas and not destructive"
